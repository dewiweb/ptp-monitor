name: Build & Release

on:
  # Build + release GitHub à chaque tag v* (ex: v1.0.0)
  push:
    tags: ["v*"]
  # Build manuel depuis l'onglet Actions (artefact, sans release)
  workflow_dispatch:

permissions:
  contents: write  # nécessaire pour créer les releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PTPMonitor main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTPMonitor-${{ github.sha }}
          path: |
            dist/PTPMonitor.exe
            devices.example.json
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PTPMonitor.exe
            devices.example.json
          generate_release_notes: true
